<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerraVault — Scene 07</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="stage">

    <div class="scene" id="scene-07">

      <div class="camera" id="camera">

        <div class="world" id="world">

          <!-- BACKGROUND -->
          <div class="layer background">
            <img src="assets/blueprint-bg.png" class="bg-img" alt="" />
          </div>


          <!-- =========================
               SHOT 1 / 2 / 5 : MAP
               ========================= -->

          <div class="layer map-group" id="mapGroup">

            <img src="assets/cave-map.png" class="map-img" alt="Nutty Putty Cave exploration map" />

            <!--
              IMPORTANT:
              This SVG uses the SAME 1000x562 coordinate
              system as cave-map.png.

              The orange stroke follows the actual
              Birth Canal passage.
            -->

            <svg class="warning-zone" id="warningZone" viewBox="0 0 1000 562" preserveAspectRatio="none"
              aria-hidden="true">

              <path id="dangerOutline" class="danger-outline" pathLength="1" d="
                  M 640 289

                  C 646 291,
                    651 298,
                    657 303

                  C 664 309,
                    671 314,
                    678 314

                  C 686 314,
                    692 310,
                    699 307

                  C 706 304,
                    712 306,
                    718 309

                  C 725 312,
                    732 311,
                    738 307

                  C 744 303,
                    749 298,
                    754 289
                " />

            </svg>


            <!-- TWO VERY SMALL INCIDENT INDICATORS -->

            <svg class="incident-layer" id="incidentLayer" viewBox="0 0 1000 562" preserveAspectRatio="none"
              aria-hidden="true">

              <circle id="incident01" class="incident-dot" cx="665" cy="307" r="3" />

              <circle id="incident02" class="incident-dot" cx="735" cy="309" r="3" />

            </svg>

          </div>


          <!-- =========================
               SHOT 3 : COMPARISON
               ========================= -->

          <div class="layer comparison" id="comparisonLayer">

            <img src="assets/comparison-visual.png" class="comparison-img"
              alt="Scout and John height and weight comparison" />

          </div>


          <!-- =========================
               SHOT 4 : PULLEY
               ========================= -->

          <div class="layer pulley" id="pulleyLayer">

            <img src="assets/pulley-visual.png" class="pulley-img" alt="Rope and pulley extraction system" />

            <div class="hours-readout" id="hoursReadout">

              <span class="hours-value">
                14
              </span>

              <span class="hours-unit">
                HOURS
              </span>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- DEVELOPMENT CONTROLS -->

  <div class="dev-panel" id="devPanel">

    <button id="btnPlay">
      Play
    </button>

    <button id="btnRestart">
      Restart
    </button>

    <input type="range" id="scrubber" min="0" max="38" step="0.01" value="0" />

    <span id="timeReadout">
      00:00.0 / 00:38.0
    </span>

    <label class="dev-toggle">
      <input type="checkbox" id="btnDebug" />
      Debug
    </label>

  </div>


  <div class="debug-hud" id="debugHud"></div>


  <script src="scene7.js"></script>

</body>

</html>
